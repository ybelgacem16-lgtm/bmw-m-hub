<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ System Critical Error</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #000;
            color: #0f0;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            user-select: none;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .overlay {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(10, 0, 0, 0.95);
            padding: 30px 20px;
            border: 2px solid #ff0000;
            border-radius: 15px;
            box-shadow: 0 0 30px #ff0000;
            max-width: 90%;
            width: 420px;
        }

        h1 {
            color: #ff0000;
            font-size: 1.5rem;
            margin-bottom: 15px;
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 1; }
            to { opacity: 0.3; }
        }

        .status-text {
            color: #ffffff;
            font-size: 1.1rem;
            margin-bottom: 20px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer {
            font-size: 2.2rem;
            color: #ffcc00;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #222;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #444;
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 0%;
            height: 20px;
            background: linear-gradient(90deg, #ff0000, #ffcc00);
            transition: width 1s linear;
        }

        .prank-reveal {
            display: none;
            color: #00ffcc;
            font-size: 2rem;
            font-weight: bold;
            text-shadow: 0 0 10px #00ffcc;
        }

        .start-btn {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 12px 24px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 0 15px #ff0000;
        }
    </style>
</head>
<body>

    <canvas id="matrix"></canvas>

    <div class="overlay" id="box">
        <!-- شاشة البدء لتفعيل الصوت وملء الشاشة -->
        <div id="start-screen">
            <h1 style="color: #ffcc00; animation: none;">⚠️ تحذير أمني عاجل</h1>
            <p style="color: #fff; margin-bottom: 20px;">تم اكتشاف ثغرة خطيرة في جهازك!</p>
            <button class="start-btn" onclick="startPrank()">فحص وتصليح النظام 🛠️</button>
        </div>

        <!-- شاشة المقلب -->
        <div id="prank-screen" style="display: none;">
            <h1>⚠️ SYSTEM CRITICAL ERROR</h1>
            <div class="status-text" id="status">جاري الاتصال بالسيرفر الخارجي...</div>
            <div class="timer" id="timer">03:00</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="bar"></div>
            </div>
            <p style="color: #888; font-size: 0.85rem;">لا تقم بإغلاق الصفحة حتى لا تفقد ملفاتك نهائياً!</p>
        </div>

        <!-- النهاية -->
        <div class="prank-reveal" id="joke">
            🤣 تعيش وتاكل غيرها! <br> مقلب يا معلم! 😜❤️
        </div>
    </div>

    <script>
        let prankActive = false;

        // --- 1. حيل منع الخروج وتعطيل زر الرجوع ---
        // تنبيه عند محاولة إغلاق Tab أو الصفحة
        window.addEventListener('beforeunload', function (e) {
            if (prankActive) {
                e.preventDefault();
                e.returnValue = 'هل أنت متأكد؟ سيتم تشفير جميع بياناتك فوراً!';
                return e.returnValue;
            }
        });

        // حيلة زر الرجوع للخلف في الهاتف (Prevent Back Button)
        function preventBack() {
            window.history.pushState(null, "", window.location.href);
        }
        setInterval(preventBack, 100);

        // تفعيل وضع ملء الشاشة Fullscreen
        function openFullscreen() {
            let elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(() => {});
            } else if (elem.webkitRequestFullscreen) { /* Safari / Chrome Mobile */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                elem.msRequestFullscreen();
            }
        }

        // --- 2. خلفية Matrix ---
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ#$@%&*';
        const fontSize = 16;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);

        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const text = chars.charAt(Math.floor(Math.random() * chars.length));
                ctx.fillText(text, i * fontSize, drops[i] * fontSize);
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        setInterval(drawMatrix, 33);

        // --- 3. صوت الإنذار ---
        let audioCtx, osc, gainNode, isAlarming = false;

        function startSiren() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            osc = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();

            osc.type = 'sawtooth';
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);

            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();

            isAlarming = true;
            sirenLoop();
        }

        function sirenLoop() {
            if (!isAlarming) return;
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(900, now + 0.6);
            osc.frequency.linearRampToValueAtTime(400, now + 1.2);
            setTimeout(sirenLoop, 1200);
        }

        function stopSiren() {
            isAlarming = false;
            if (audioCtx) {
                audioCtx.close();
            }
        }

        // --- 4. تشغيل المقلب والعداد (3 دقائق = 180 ثانية) ---
        const messages = [
            "جاري اختراق ذاكرة الهاتف...",
            "جاري استخراج صور المعرض...",
            "جاري الوصول إلى حسابات التواصل...",
            "جاري تشفير كل الملفات الشخصية...",
            "جاري سحب المحادثات والرسائل...",
            "تم نقل 50% من البيانات...",
            "جاري رفع الصور إلى السيرفر...",
            "تشفير النظام بالكامل قريب جداً..."
        ];

        let totalTime = 180;
        let timeRemaining = totalTime;

        function startPrank() {
            prankActive = true;
            openFullscreen(); // دخول ملء الشاشة

            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('prank-screen').style.display = 'block';

            startSiren();

            const timerEl = document.getElementById('timer');
            const barEl = document.getElementById('bar');
            const statusEl = document.getElementById('status');

            const interval = setInterval(() => {
                timeRemaining--;

                const mins = Math.floor(timeRemaining / 60);
                const secs = timeRemaining % 60;
                timerEl.innerText = `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;

                const progress = ((totalTime - timeRemaining) / totalTime) * 100;
                barEl.style.width = progress + '%';

                if (timeRemaining % 15 === 0) {
                    const randomMsg = messages[Math.floor(Math.random() * messages.length)];
                    statusEl.innerText = randomMsg;
                }

                if (timeRemaining <= 0) {
                    clearInterval(interval);
                    stopSiren();
                    prankActive = false;

                    document.getElementById('prank-screen').style.display = 'none';
                    document.getElementById('box').style.borderColor = '#00ffcc';
                    document.getElementById('box').style.boxShadow = '0 0 30px #00ffcc';
                    document.getElementById('joke').style.display = 'block';
                }
            }, 1000);
        }
    </script>
</body>
</html>
